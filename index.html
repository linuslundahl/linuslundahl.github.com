    /* CSS */
    :root {
      font-family: Inter, sans-serif;
      font-feature-settings: 'liga' 1, 'calt' 1; /* fix for Chrome */
    }

    @supports (font-variation-settings: normal) {
      :root { font-family: InterVariable, sans-serif; }
    }

    @keyframes slideIn {
      0% {
        transform: translate(-10px, 0px);
        opacity: 0;
      }
      100% {
        transform: none;
        opacity: 1;
      }
    }

    body {
      background-color: #eee;
      color: #222;
      font-size: 1rem;
      font-weight: 400;
      line-height: 1;
      letter-spacing: 2px;
      line-height: 1;
      padding: 1.25rem;

    h1 {
      display: inline-block;
      max-width: 120px;
      margin: 0;
      padding: 0;
    }

    h1 svg {
      display: block;
      width: 100%;
      height: auto;
    }

    ul {
      /* display: inline; */
      margin: 2rem 0;
      padding: 0;
      list-style-type: none;
    }

    li {
      margin: 0.75rem 0;
      padding: 0;
    }

    a {
      color: #666;
      text-decoration: none;
    }

    a::after {
      content: '->';
      opacity: 0;
      transform: translate(-10px, 0);
      display: inline-block;
      white-space: nowrap;
      margin-left: 0.5rem;
      color: #222;
    }

    a:hover::after {
      animation: slideIn 0.5s ease-out 0s 1 normal both;
    }

    .description {
      text-transform: uppercase;
    }

    .projects a {
      color: #F6C90E;
      text-transform: none;
    }

    .links a {
      color: #4f7464;
    }

    @media (min-width: 400px) {
      body {
        font-size: 2rem;
        padding: 2rem;
      }

      h1 {
        max-width: 160px;
      }
    }

    @media (prefers-color-scheme: dark) {
      body {
        background-color: #222;
        color: #eee;
      }

      svg path {
        fill: #eee;
      }

      a:hover::after {
        color: #eee;
      }
    }
  </style>
